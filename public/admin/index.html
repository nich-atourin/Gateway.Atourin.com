<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Atourin Gateway</title>
<link rel="icon" href="/assets/logo.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241F3D; --ink-dim:#6B6584; --purple:#7068D5; --purple-deep:#5B52C4; --purple-soft:#EFEDFB;
    --yellow:#FFC442; --yellow-soft:#FFF6E0; --yellow-deep:#B87E00;
    --coral:#F46263; --coral-soft:#FDEAEA; --coral-deep:#C43B3C;
    --green:#1E9E6A; --green-soft:#E3F6EE;
    --bg:#F6F5FA; --card:#fff; --border:#E3E0EE; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;font-size:14px;line-height:1.45}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;color:inherit}

  /* ---- layout ---- */
  .wrap{max-width:780px;margin:0 auto;padding:20px 16px 120px}
  header.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  header.top img{height:30px}
  header.top h1{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:600;flex:1;min-width:120px}
  .tabs{display:flex;gap:4px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:16px;overflow-x:auto}
  .tab{flex:1;white-space:nowrap;border:0;background:transparent;padding:9px 12px;border-radius:9px;font-weight:600;color:var(--ink-dim)}
  .tab.on{background:var(--purple);color:#fff}
  .tab small{opacity:.75;font-weight:500;margin-left:4px}
  .intro{color:var(--ink-dim);margin:0 2px 14px;font-size:13px}

  /* ---- buttons ---- */
  .btn{display:inline-block;text-decoration:none;color:inherit;border:1px solid var(--border);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;transition:.15s}
  .btn:hover{border-color:var(--purple);color:var(--purple)}
  .btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}
  .btn.primary:hover{background:var(--purple-deep);color:#fff}
  .btn.danger:hover{border-color:var(--coral);color:var(--coral)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
  .add{width:100%;border:1.5px dashed var(--purple);background:var(--purple-soft);color:var(--purple);border-radius:var(--radius);padding:13px;font-weight:600;margin-top:10px}
  .add:hover{background:#E6E3F9}

  /* ---- item cards ---- */
  .item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
  .item[open]{border-color:var(--purple);box-shadow:0 6px 20px -10px rgba(112,104,213,.45)}
  .item summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px;cursor:pointer}
  .item summary::-webkit-details-marker{display:none}
  .item summary::after{content:'';width:8px;height:8px;border-right:2px solid var(--ink-dim);border-bottom:2px solid var(--ink-dim);transform:rotate(45deg);margin:0 6px 4px 2px;transition:.15s;flex:none}
  .item[open] summary::after{transform:rotate(-135deg);margin-bottom:-2px}
  .sum-ico{flex:none;width:42px;height:42px;border-radius:12px;background:var(--purple);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .sum-ico svg{width:20px;height:20px;stroke:#fff}
  .sum-ico img{width:100%;height:100%;object-fit:cover}
  .sum-ico.c-coral{background:var(--coral)} .sum-ico.c-yellow{background:var(--yellow)}
  .sum-ico.thumb{background:var(--purple-soft)}
  .sum-main{flex:1;min-width:0}
  .sum-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sum-sub{color:var(--ink-dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sum-actions{display:flex;gap:4px;flex:none}
  .icon-btn{width:30px;height:30px;border:1px solid var(--border);background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink-dim);padding:0;font-size:14px}
  .icon-btn:hover{border-color:var(--purple);color:var(--purple)}
  .icon-btn.del:hover{border-color:var(--coral);color:var(--coral)}
  .icon-btn:disabled{opacity:.3;cursor:default}
  .badge{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:#EEEDF3;color:var(--ink-dim);margin-right:6px;vertical-align:1px}
  .badge.live{background:var(--green-soft);color:var(--green)}
  .badge.soon{background:var(--purple-soft);color:var(--purple)}
  .badge.sched{background:var(--yellow-soft);color:var(--yellow-deep)}
  .item-body{padding:6px 14px 16px;border-top:1px solid var(--border);display:grid;gap:12px}

  /* ---- form ---- */
  .field{display:grid;gap:5px}
  .field .lbl{font-weight:600;font-size:12.5px}
  .field small{color:var(--ink-dim);font-size:11.5px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  input[type=text],input[type=password],input[type=url],input[type=datetime-local],select,textarea{
    width:100%;border:1px solid var(--border);border-radius:10px;padding:9px 11px;background:#fff;outline:none;transition:.15s}
  textarea{resize:vertical;min-height:70px}
  input:focus,select:focus,textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(112,104,213,.15)}
  .switch{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;margin-top:8px}
  .switch input{position:absolute;opacity:0}
  .switch i{width:38px;height:22px;border-radius:99px;background:#CFCBDD;position:relative;transition:.15s;flex:none}
  .switch i::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
  .switch input:checked+i{background:var(--green)}
  .switch input:checked+i::after{left:19px}
  .switch input:focus-visible+i{box-shadow:0 0 0 3px rgba(112,104,213,.3)}
  .checks{display:flex;flex-wrap:wrap;gap:8px}
  .chk{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:99px;padding:6px 12px;cursor:pointer;font-weight:500}
  .chk:has(input:checked){background:var(--purple-soft);border-color:var(--purple);color:var(--purple-deep)}
  .colors{display:flex;gap:8px}
  .colors button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--border)}
  .colors button.on{box-shadow:0 0 0 2.5px var(--ink)}

  /* ---- icon picker / image ---- */
  .icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
  .icon-grid button{aspect-ratio:1;border:1px solid var(--border);background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0}
  .icon-grid button svg{width:19px;height:19px;stroke:var(--ink-dim)}
  .icon-grid button:hover{border-color:var(--purple)}
  .icon-grid button.on{background:var(--purple);border-color:var(--purple)}
  .icon-grid button.on svg{stroke:#fff}
  .up-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .up-row img{width:52px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--border);background:var(--purple-soft)}
  .up-row img.sq{width:40px;height:40px;object-fit:contain;height:40px}
  .up-row .ph{width:52px;height:64px;border-radius:10px;border:1.5px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--ink-dim);font-size:11px;text-align:center}
  .hide{display:none}

  /* ---- savebar / toast ---- */
  .savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);padding:12px 16px;z-index:10}
  .savebar .in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:10px}
  .savebar .st{flex:1;color:var(--ink-dim);font-size:13px}
  .savebar.dirty .st{color:var(--yellow-deep);font-weight:600}
  .toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;z-index:20;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:500}
  .toast.err{background:var(--coral-deep)}
  .toast.ok{background:#157A52}

  /* ---- login ---- */
  .login{max-width:360px;margin:12vh auto 0;background:#fff;border:1px solid var(--border);border-radius:20px;padding:28px 24px;box-shadow:0 24px 60px -24px rgba(36,31,61,.25);display:grid;gap:14px;text-align:center}
  .login img{height:44px;margin:0 auto}
  .login h1{font-family:'Space Grotesk',sans-serif;font-size:18px}
  .login p{color:var(--ink-dim);font-size:13px}
  .err-msg{color:var(--coral-deep);font-size:13px;min-height:18px}
  .note{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px;color:var(--ink-dim);font-size:12.5px;margin-top:10px}
  .note b{color:var(--ink)}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script src="/js/icons.js"></script>
<script src="/js/util.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
