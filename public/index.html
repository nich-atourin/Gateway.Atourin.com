<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atourin Event — Gateway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241F3D;
    --ink-dim:#6B6584;
    --purple:#7068D5;
    --purple-deep:#5B52C4;
    --purple-soft:#EFEDFB;
    --yellow:#FFC442;
    --yellow-soft:#FFF6E0;
    --yellow-deep:#B87E00;
    --coral:#F46263;
    --coral-soft:#FDEAEA;
    --coral-deep:#C43B3C;
    --bg:#FAFAFB;
    --card:#FFFFFF;
    --border:#E7E4F0;
    --page-bg-image:none;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}

  body{
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background-color:var(--bg);
    background-image:var(--page-bg-image);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }

  main{
    width:100%;
    max-width:420px;
    padding:52px 18px 44px;
    opacity:0;
    transform:translateY(10px);
    transition:opacity 0.45s ease, transform 0.45s ease;
  }
  main.reveal{ opacity:1; transform:translateY(0); }

  /* ---------- Desktop / wide-viewport layout ---------- */
  /* This page is a mobile-first link-in-bio card; on wider screens it
     keeps the same narrow column but presents it as a framed card
     floating over a soft brand-colored backdrop, instead of a thin
     stripe of content lost in a sea of white. */
  @media (min-width:680px){
    :root{
      --page-bg-image:
        linear-gradient(135deg,
          rgba(112,104,213,0.16) 0%,
          rgba(255,196,66,0.12) 50%,
          rgba(244,98,99,0.16) 100%);
    }
    body{
      align-items:flex-start;
      padding:56px 24px;
      background-attachment:fixed;
    }
    main{
      max-width:440px;
      margin-top:4px;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:28px;
      box-shadow:0 24px 70px -22px rgba(36,31,61,0.18), 0 4px 18px rgba(36,31,61,0.05);
    }
  }

  /* ---------- Header ---------- */

  .brand-logo{
    display:block;
    width:200px;
    max-width:72%;
    margin:0 auto 18px;
  }

  h1{
    position:absolute;
    width:1px; height:1px;
    padding:0; margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }

  p.tag{
    margin-top:8px;
    text-align:center;
    font-family:'Space Grotesk',sans-serif;
    font-size:15.5px;
    font-weight:500;
    color:var(--ink);
    letter-spacing:-0.005em;
    line-height:1.4;
    padding:0 12px;
  }
  p.tag .tag-accent{
    color:var(--purple);
    font-weight:700;
    cursor:pointer;
    position:relative;
    border-radius:4px;
    transition:color 0.15s ease;
  }
  p.tag .tag-accent:hover,
  p.tag .tag-accent:focus-visible{
    color:var(--purple-deep);
  }
  p.tag .tag-accent:focus-visible{
    outline:2px solid var(--purple);
    outline-offset:3px;
  }
  p.tag .tag-accent:active{
    animation:tagPulse 0.3s ease;
  }
  @keyframes tagPulse{
    0%{ transform:scale(1); }
    40%{ transform:scale(0.88); }
    100%{ transform:scale(1); }
  }
  p.tag .tag-accent{ display:inline-block; }

  /* ---------- Official links row ---------- */

  .official{
    display:flex;
    justify-content:center;
    gap:22px;
    margin-top:24px;
  }
  .official a{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    text-decoration:none;
    color:var(--ink-dim);
  }
  .official .ico{
    width:44px; height:44px;
    border-radius:50%;
    background:var(--card);
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    transition:background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
  }
  .official a:hover .ico{
    background:var(--purple);
    border-color:var(--purple);
    transform:translateY(-2px);
  }
  .official .ico svg{ width:18px; height:18px; stroke:var(--purple); transition:stroke 0.18s ease; }
  .official a:hover .ico svg{ stroke:#fff; }
  .official span.lbl{ font-size:10.5px; }

  /* ---------- Section heading ---------- */

  .section-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin:36px 4px 14px;
  }
  .section-head h2{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:15px;
  }
  .live-dot{
    width:7px; height:7px;
    border-radius:50%;
    background:var(--coral);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; box-shadow:0 0 0 0 rgba(244,98,99,0.4); }
    50%{ opacity:0.6; box-shadow:0 0 0 5px rgba(244,98,99,0); }
  }

  /* ---------- Event cards ---------- */

  .events{ display:flex; flex-direction:column; gap:12px; }

  .event-card{
    position:relative;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:0 1px 3px rgba(36,31,61,0.05);
    text-decoration:none;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:stretch;
    padding:12px;
    transition:box-shadow 0.2s ease, transform 0.2s ease, opacity 0.3s ease, border-color 0.2s ease;
  }
  .event-card:hover{
    box-shadow:0 8px 20px rgba(36,31,61,0.09);
    transform:translateY(-2px);
    border-color:var(--purple);
  }
  .event-card.ended{ opacity:0.5; }
  .event-card.ended:hover{ transform:none; box-shadow:0 1px 3px rgba(36,31,61,0.05); border-color:var(--border); }
  .event-card[style*="display: none"]{ display:none !important; }

  .etop{
    position:relative;
    display:flex;
    align-items:stretch;
    gap:12px;
  }

  .ethumb{
    position:relative;
    flex:0 0 auto;
    width:64px;
    border-radius:12px;
    overflow:hidden;
  }
  .ethumb.theme-a{ background:var(--purple-soft); }
  .ethumb.theme-b{ background:#FFF6E0; }
  .ethumb svg{ position:absolute; inset:0; width:100%; height:100%; }
  .ethumb-dot{
    position:absolute; top:5px; right:5px;
    width:7px; height:7px; border-radius:50%;
    background:var(--coral);
    box-shadow:0 0 0 2px #fff;
    display:none;
  }
  .event-card.ongoing-card .ethumb-dot{ display:block; animation:pulse 1.6s ease-in-out infinite; }

  .econtent{ flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; }

  .ename{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:14.5px;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .emeta{
    display:flex;
    flex-direction:column;
    gap:3px;
    margin-top:5px;
  }
  .emeta-row{
    display:flex;
    align-items:center;
    gap:5px;
    min-width:0;
    font-size:11.5px;
    line-height:1.35;
    color:var(--ink-dim);
  }
  .emeta-row svg{ width:11px; height:11px; flex:0 0 auto; stroke:var(--ink-dim); }
  .emeta-row span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }


  .ecd-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:12px;
  }

  .ecd-label{
    font-size:10.5px;
    color:var(--ink-dim);
    flex:0 0 auto;
  }

  .ecd{
    display:inline-flex;
    align-items:flex-start;
    gap:4px;
    flex:0 0 auto;
  }
  .ecd .cell{
    background:transparent;
    border:1.3px solid var(--purple);
    border-radius:6px;
    min-width:22px;
    padding:2.5px 4px 2px;
    text-align:center;
  }
  .ecd .cell .n{
    display:block;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:11px;
    line-height:1.05;
    color:var(--purple);
    font-variant-numeric:tabular-nums;
  }
  .ecd .cell .u{
    display:block;
    font-size:6px;
    letter-spacing:0.01em;
    color:var(--ink-dim);
    margin-top:1px;
    white-space:nowrap;
  }
  .ecd .colon{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:11px;
    line-height:1.05;
    color:var(--purple);
    margin-top:3px;
    flex:0 0 auto;
  }
  .ecd.tier-warning .cell{ border-color:var(--yellow); }
  .ecd.tier-warning .cell .n{ color:#454545; }
  .ecd.tier-warning .colon{ color:var(--yellow); }
  .ecd.tier-danger .cell{ border-color:var(--coral); }
  .ecd.tier-danger .cell .n{ color:var(--coral); }
  .ecd.tier-danger .colon{ color:var(--coral); }

  .ecd-ended{
    display:inline-flex;
    align-items:center;
    gap:5px;
    margin-top:12px;
    align-self:flex-start;
    font-size:11px;
    font-weight:600;
    color:var(--ink-dim);
    background:#F0EFF4;
    padding:5px 9px;
    border-radius:100px;
  }
  .ecd-ended svg{ width:11px; height:11px; flex:0 0 auto; stroke:var(--ink-dim); }



  footer{
    margin-top:38px;
    text-align:center;
    font-size:11.5px;
    color:var(--ink-dim);
  }

  a:focus-visible, .official a:focus-visible .ico{ outline:2px solid var(--purple); outline-offset:2px; }

  /* ---------- Atourin Event promo cards ---------- */

  .gw-mark{
    color:var(--purple);
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .gw-mark sup{
    font-size:0.5em;
    font-weight:600;
    margin-left:1px;
  }

  /* ---------- Teleport easter egg ---------- */

  #main{ will-change:transform, opacity; }
  #main.warp-out{
    transition:transform 0.3s ease, opacity 0.3s ease;
    transform:scale(0.97);
    opacity:0.4;
  }
  #main.warp-in{
    animation:warpInBounce 0.4s cubic-bezier(.3,1.4,.4,1) forwards;
  }
  @keyframes warpInBounce{
    0%{ transform:scale(0.97); opacity:0.4; }
    65%{ transform:scale(1.015); opacity:1; }
    100%{ transform:scale(1); opacity:1; }
  }

  .teleport-flash{
    position:fixed;
    inset:0;
    z-index:60;
    background:radial-gradient(circle, var(--coral) 0%, var(--purple) 55%, var(--purple-deep) 100%);
    clip-path:circle(0% at 50% 50%);
    opacity:0;
    pointer-events:none;
  }
  .teleport-flash.expand{
    animation:teleportExpand 0.4s cubic-bezier(.55,0,.35,1) forwards;
  }
  .teleport-flash.collapse{
    animation:teleportCollapse 0.4s cubic-bezier(.55,0,.35,1) forwards;
  }
  @keyframes teleportExpand{
    0%{ clip-path:circle(0% at var(--tx) var(--ty)); opacity:0; }
    12%{ opacity:1; }
    100%{ clip-path:circle(175% at var(--tx) var(--ty)); opacity:1; }
  }
  @keyframes teleportCollapse{
    0%{ clip-path:circle(175% at var(--tx) var(--ty)); opacity:1; }
    100%{ clip-path:circle(0% at var(--tx) var(--ty)); opacity:0; }
  }

  .portal-ring{
    position:fixed;
    z-index:61;
    width:12px; height:12px;
    border-radius:50%;
    border:2.5px solid rgba(255,255,255,0.9);
    transform:translate(-50%,-50%) scale(0);
    opacity:0;
    pointer-events:none;
    animation:ringPulse 0.55s cubic-bezier(.2,.75,.3,1) forwards;
  }
  @keyframes ringPulse{
    0%{ transform:translate(-50%,-50%) scale(0); opacity:0.9; }
    100%{ transform:translate(-50%,-50%) scale(16); opacity:0; }
  }

  .section-head.teleport-landed .gw-mark{
    display:inline-block;
    animation:landedPop 0.45s cubic-bezier(.3,1.6,.4,1);
  }
  @keyframes landedPop{
    0%{ transform:scale(1.4); opacity:0.3; }
    100%{ transform:scale(1); opacity:1; }
  }

  @media (prefers-reduced-motion: reduce){
    .teleport-flash, .portal-ring{ display:none !important; }
    #main.warp-out, #main.warp-in{
      transform:none !important; opacity:1 !important; transition:none !important; animation:none !important;
    }
    .section-head.teleport-landed .gw-mark{ animation:none !important; }
  }

  .promo-list{ display:flex; flex-direction:column; gap:12px; }

  .promo-card{
    display:flex;
    flex-direction:column;
    gap:10px;
    border-radius:18px;
    padding:16px;
    text-decoration:none;
    color:var(--ink);
    transition:box-shadow 0.2s ease, transform 0.2s ease;
  }
  .promo-card:hover{
    box-shadow:0 10px 22px rgba(36,31,61,0.08);
    transform:translateY(-2px);
  }

  .promo-head{ display:flex; align-items:center; gap:10px; }

  .promo-icon{
    flex:0 0 auto;
    width:40px; height:40px;
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
  }
  .promo-icon svg{ width:20px; height:20px; stroke:#fff; }

  .promo-title{
    flex:1;
    min-width:0;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:14px;
    line-height:1.3;
  }
  .promo-desc{
    font-size:11.5px;
    color:var(--ink-dim);
    line-height:1.5;
  }

  .promo-cta{
    display:inline-flex;
    align-items:center;
    gap:5px;
    align-self:flex-start;
    background:var(--card);
    font-size:11.5px;
    font-weight:600;
    padding:7px 13px 7px 14px;
    border-radius:100px;
    box-shadow:0 1px 2px rgba(36,31,61,0.07);
    transition:gap 0.2s ease, background 0.2s ease, color 0.2s ease;
  }
  .promo-cta svg{ width:10px; height:10px; transition:stroke 0.2s ease; }
  .promo-card:hover .promo-cta{ gap:8px; }

  .promo-card.c-purple{ background:var(--purple-soft); }
  .promo-card.c-purple .promo-icon{ background:var(--purple); }
  .promo-card.c-purple .promo-cta{ color:var(--purple); }
  .promo-card.c-purple .promo-cta svg{ stroke:var(--purple); }
  .promo-card.c-purple:hover .promo-cta{ background:var(--purple); color:#fff; }
  .promo-card.c-purple:hover .promo-cta svg{ stroke:#fff; }

  .promo-card.c-coral{ background:var(--coral-soft); }
  .promo-card.c-coral .promo-icon{ background:var(--coral); }
  .promo-card.c-coral .promo-cta{ color:var(--coral); }
  .promo-card.c-coral .promo-cta svg{ stroke:var(--coral); }
  .promo-card.c-coral:hover .promo-cta{ background:var(--coral); color:#fff; }
  .promo-card.c-coral:hover .promo-cta svg{ stroke:#fff; }

  .promo-card.c-yellow{ background:var(--yellow-soft); }
  .promo-card.c-yellow .promo-icon{ background:var(--yellow); }
  .promo-card.c-yellow .promo-cta{ color:var(--yellow); }
  .promo-card.c-yellow .promo-cta svg{ stroke:var(--yellow); }
  .promo-card.c-yellow:hover .promo-cta{ background:var(--yellow); color:#fff; }
  .promo-card.c-yellow:hover .promo-cta svg{ stroke:#fff; }

  /* ---------- Loader ---------- */

  .loader{
    position:fixed; inset:0; z-index:20;
    background-color:var(--bg);
    background-image:var(--page-bg-image);
    display:flex; align-items:center; justify-content:center;
    transition:opacity 0.4s ease;
  }
  .loader.done{ opacity:0; pointer-events:none; }

  .loader-mark{
    width:140px; height:140px;
  }
  .loader-mark img{
    width:100%; height:100%;
    object-fit:contain;
    display:block;
  }

  @media (prefers-reduced-motion: reduce){
    .loader{ display:none !important; }
    main{ opacity:1 !important; transform:none !important; }
    .live-dot{ animation:none !important; }
  }

  /* ---------- Dynamic-content additions ---------- */
  .official{ flex-wrap:wrap; row-gap:16px; column-gap:20px; padding:0 4px; }
  .official .official-item{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    text-decoration:none; color:var(--ink-dim); width:60px;
  }
  .official .official-item.no-link{ cursor:default; }
  .official .official-item:hover .ico{ background:var(--purple); border-color:var(--purple); transform:translateY(-2px); }
  .official .official-item:hover .ico svg{ stroke:#fff; }
  .official .official-item.no-link:hover .ico{ background:var(--card); border-color:var(--border); transform:none; }
  .official .official-item.no-link:hover .ico svg{ stroke:var(--purple); }
  .official span.lbl{ max-width:100%; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .official .ico img{ width:22px; height:22px; object-fit:contain; border-radius:4px; }
  .official-item:focus-visible .ico{ outline:2px solid var(--purple); outline-offset:2px; }

  .ethumb{ min-height:64px; }
  .ethumb img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  div.event-card.no-link:hover{ transform:none; border-color:var(--border); box-shadow:0 1px 3px rgba(36,31,61,0.05); }
  .events-empty{
    display:none; text-align:center; font-size:12.5px; line-height:1.5; color:var(--ink-dim);
    background:var(--purple-soft); border-radius:16px; padding:22px 18px;
  }

  .promo-icon img{ width:22px; height:22px; object-fit:contain; border-radius:4px; }
  div.promo-card.no-link:hover{ transform:none; box-shadow:none; }
  .promo-card.no-link{ cursor:default; }
</style>
<meta name="description" content="Atourin Event — Your Gateway to Every Event">
<meta property="og:title" content="Atourin Event — Gateway">
<meta property="og:description" content="Your Gateway to Every Event">
<meta property="og:image" content="/assets/logo.webp">
<link rel="icon" href="/assets/logo.webp" type="image/webp">
<noscript><style>.loader{display:none} main{opacity:1;transform:none}</style></noscript>
</head>
<body>

<div class="teleport-flash" id="teleportFlash"></div>

<div class="loader" id="loader">
  <div class="loader-mark">
    <img class="loader-anim" src="/assets/loader.webp" alt="">
  </div>
</div>

<main id="main">

  <img class="brand-logo" src="/assets/logo.webp" alt="Atourin Event">
  <h1>Atourin Event</h1>
  <p class="tag">Your <span class="tag-accent" id="teleportTrigger" role="button" tabindex="0" aria-label="Teleport to the Gateway section">Gateway</span> to Every Event</p>

  <div class="official" id="official"></div>

  <div class="section-head">
    <span class="live-dot"></span>
    <h2 id="eventsTitle">Event Berlangsung</h2>
  </div>

  <div class="events" id="events">
    <div class="events-empty" id="eventsEmpty"></div>
  </div>

  <div class="section-head" id="gatewaySection">
    <h2><span id="gatewayTitleText">Elevate your event with</span> <span class="gw-mark">Gateway<sup>™</sup></span></h2>
  </div>

  <div class="promo-list" id="promoList"></div>

  <footer id="footerText"></footer>

</main>

<script src="/js/icons.js"></script>
<script src="/js/util.js"></script>
<script src="/js/app.js"></script>
<script src="/js/teleport.js"></script>
</body>
</html>
